    <style id="theme-vars">
/*
 * Pinguo design tokens — extended for solo-design consumption
 * Brand: Pinguo (Apple Design Library)
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * This file extends the Apple Design Library colors_and_type.css with
 * required semantic radius aliases for apply-html-head-contract.mjs.
 * All original tokens are preserved unchanged.
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, Roboto, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, Roboto, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* Radius semantic aliases for solo-design apply-html-head-contract.mjs */
  --apple-radius-sm: 0.5rem;
  --apple-radius-md: 0.75rem;
  --apple-radius-lg: var(--radius);
  --apple-radius-xl: calc(var(--radius) * 1.25);

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

      <style>
        /* ===== Onboarding Page Styles ===== */
        * {
          -webkit-tap-highlight-color: transparent;
        }

        .page-container {
          max-width: 480px;
          margin: 0 auto;
          min-height: 100vh;
          background: var(--apple-background);
          display: flex;
          flex-direction: column;
          padding-top: env(safe-area-inset-top, 0px);
          padding-bottom: env(safe-area-inset-bottom, 0px);
          position: relative;
        }

        /* ===== Header ===== */
        .onb-header {
          padding: 16px 20px 12px;
          background: var(--apple-background);
          box-shadow: var(--shadow-2xs);
          z-index: 10;
        }

        .onb-header-row {

        @keyframes onbFadeIn {

          to { opacity: 1; transform: translateY(0); }

        .onb-step-title {

        .onb-step-subtitle {

        /* ===== Section Label ===== */
        .onb-section-label {

        /* ===== Gender Cards ===== */
        .onb-gender-grid {

        .onb-gender-card {

        .onb-activity-item .activity-check svg {

        .onb-activity-item.active {

        /* ===== Footer ===== */

        .onb-btn-primary {

          transform: scale(0.98);

        }

        .onb-btn-back {

        .onb-btn-next {
          flex: 2;

          color: var(--apple-primary-foreground);

        /* ===== Small screen breakpoint ===== */
        @media (max-width: 360px) {
          .onb-content {
            padding: 20px 16px 20px;

          .onb-header {

            padding: 10px 16px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));

          .onb-gender-grid,
          .onb-goal-grid {
            gap: 10px;
          }
          .onb-gender-card {
            min-height: 84px;
          }
        }
      </style>

      <div class="page-container">
        <!-- ===== Header with Progress ===== -->
        <div class="onb-header">
          <div class="onb-header-row">
            <span class="onb-step-indicator">1 / 3</span>
            <span class="onb-step-label">微量生活 · 建档</span>
          </div>
          <div class="onb-progress-track">
            <div class="onb-progress-fill"></div>
          </div>
        </div>

        <!-- ===== Content ===== -->
        <div class="onb-content">

          <!-- ===== Step 1: Gender + Age (ACTIVE) ===== -->
          <div class="onb-step active" id="step-1">
            <h2 class="onb-step-title"><span class="step-num">01</span>先了解一下你</h2>
            <p class="onb-step-subtitle">性别与年龄影响营养与运动建议</p>

            <!-- Gender -->
            <div class="onb-section-block">
              <div class="onb-section-label">性别</div>
              <div class="onb-gender-grid">
                <div class="onb-gender-card active" data-gender="male">
                  <span class="gender-icon"><i data-lucide="user"></i></span>
                  <span class="gender-label">男</span>
                </div>
                <div class="onb-gender-card" data-gender="female">
                  <span class="gender-icon"><i data-lucide="user-round"></i></span>
                  <span class="gender-label">女</span>
                </div>
              </div>
            </div>

            <!-- Age -->
            <div class="onb-section-block">
              <div class="onb-section-label">年龄：<span class="accent-val" id="age-display">25</span> 岁</div>
              <input type="range" class="onb-slider" id="age-slider" min="12" max="80" value="25" inputmode="numeric">
              <div class="onb-slider-range">
                <span>12 岁</span>
                <span>80 岁</span>
              </div>
            </div>
          </div>

          <!-- ===== Step 2: Body Data (hidden) ===== -->
          <div class="onb-step" id="step-2">
            <h2 class="onb-step-title"><span class="step-num">02</span>身体数据</h2>
            <p class="onb-step-subtitle">用于计算 BMI 与每日营养目标</p>

            <div class="onb-slider-card">
              <div class="onb-slider-card-head">
                <span class="onb-slider-card-label">身高</span>
                <span class="onb-slider-card-value">170<span class="unit">cm</span></span>
              </div>
              <input type="range" class="onb-slider" min="140" max="210" value="170" inputmode="numeric">
              <div class="onb-slider-range"><span>140 cm</span><span>210 cm</span></div>
            </div>

            <div class="onb-slider-card">
              <div class="onb-slider-card-head">
                <span class="onb-slider-card-label">体重</span>
                <span class="onb-slider-card-value">65<span class="unit">kg</span></span>
              </div>
              <input type="range" class="onb-slider" min="30" max="150" value="65" inputmode="numeric">
              <div class="onb-slider-range"><span>30 kg</span><span>150 kg</span></div>
            </div>

            <div class="onb-slider-card">
              <div class="onb-slider-card-head">
                <span class="onb-slider-card-label">目标体重</span>
                <span class="onb-slider-card-value">60<span class="unit">kg</span></span>
              </div>
              <input type="range" class="onb-slider" min="30" max="150" value="60" inputmode="numeric">
              <div class="onb-slider-range"><span>30 kg</span><span>150 kg</span></div>
            </div>
          </div>

          <!-- ===== Step 3: Goals (hidden) ===== -->
          <div class="onb-step" id="step-3">
            <h2 class="onb-step-title"><span class="step-num">03</span>你的健康目标</h2>
            <p class="onb-step-subtitle">AI 将围绕此目标给出个性化建议</p>

            <!-- Goal options -->
            <div class="onb-section-label">选择目标</div>
            <div class="onb-goal-grid">
              <div class="onb-goal-card active" data-goal="fat-loss">
                <span class="goal-icon"><i data-lucide="flame"></i></span>
                <span class="goal-label">减脂塑形</span>
              </div>
              <div class="onb-goal-card" data-goal="muscle-gain">
                <span class="goal-icon"><i data-lucide="dumbbell"></i></span>
                <span class="goal-label">增肌增重</span>
              </div>
              <div class="onb-goal-card" data-goal="maintain">
                <span class="goal-icon"><i data-lucide="scale"></i></span>
                <span class="goal-label">保持健康</span>

                <span class="goal-label">改善睡眠</span>
              </div>
              <div class="onb-goal-card" data-goal="stress">
                <span class="goal-icon"><i data-lucide="brain"></i></span>
                <span class="goal-label">缓解压力</span>
              </div>
            </div>

            <!-- Activity level -->
            <div class="onb-section-label" style="margin-top: 8px;">活动水平</div>
            <div class="onb-activity-list">
              <div class="onb-activity-item active" data-activity="sedentary">
                <span class="activity-label">久坐</span>
                <span class="activity-check"><i data-lucide="check"></i></span>
              </div>
              <div class="onb-activity-item" data-activity="light">
                <span class="activity-label">轻度</span>
                <span class="activity-check"><i data-lucide="check"></i></span>
              </div>
              <div class="onb-activity-item" data-activity="moderate">
                <span class="activity-label">中度</span>
                <span class="activity-check"><i data-lucide="check"></i></span>
              </div>
              <div class="onb-activity-item" data-activity="high">
                <span class="activity-label">高度</span>
                <span class="activity-check"><i data-lucide="check"></i></span>
              </div>
              <div class="onb-activity-item" data-activity="extreme">
                <span class="activity-label">极高</span>
                <span class="activity-check"><i data-lucide="check"></i></span>

          </div>

        </div>

        <!-- ===== Footer (Step 1: single button) ===== -->
        <div class="onb-footer">
          <div class="onb-footer-single" id="footer-single">

              下一步
              <i data-lucide="arrow-right"></i>
            </button>
          </div>
          <div class="onb-footer-double" id="footer-double" style="display:none;">
            <button class="onb-btn onb-btn-back" id="btn-back">
              <i data-lucide="arrow-left"></i>
              上一步
            </button>
            <button class="onb-btn onb-btn-next" id="btn-next-double" data-dom-id="btn-complete">
              下一步
              <i data-lucide="arrow-right"></i>
            </button>
          </div>
        </div>
      </div>

      <script>
        // Initialize Lucide icons
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }

        // ===== Onboarding interaction logic =====
        (function() {
          var currentStep = 1;
          var totalSteps = 3;

          var stepEls = {
            1: document.getElementById('step-1'),
            2: document.getElementById('step-2'),
            3: document.getElementById('step-3')
          };

          var stepIndicator = document.querySelector('.onb-step-indicator');
          var progressFill = document.querySelector('.onb-progress-fill');
          var footerSingle = document.getElementById('footer-single');
          var footerDouble = document.getElementById('footer-double');

          function showStep(step) {
            for (var i = 1; i <= totalSteps; i++) {
              if (stepEls[i]) {
                stepEls[i].classList.toggle('active', i === step);
              }
            }
            stepIndicator.textContent = step + ' / ' + totalSteps;
            progressFill.style.width = (step / totalSteps * 100) + '%';

            if (step === 1) {
              footerSingle.style.display = 'flex';
              footerDouble.style.display = 'none';
            } else {
              footerSingle.style.display = 'none';
              footerDouble.style.display = 'flex';
            }

            // Update next button text on last step
            var nextDouble = document.getElementById('btn-next-double');
            if (step === totalSteps) {
              nextDouble.innerHTML = '完成建档 <i data-lucide="check"></i>';
            } else {
              nextDouble.innerHTML = '下一步 <i data-lucide="arrow-right"></i>';
            }
            if (window.lucide) window.lucide.createIcons();
          }

          document.getElementById('btn-next-single').addEventListener('click', function() {
            if (currentStep < totalSteps) {
              currentStep++;
              showStep(currentStep);
            }
          });

          document.getElementById('btn-next-double').addEventListener('click', function() {
            if (currentStep < totalSteps) {
              currentStep++;
              showStep(currentStep);
            }
          });

          document.getElementById('btn-back').addEventListener('click', function() {
            if (currentStep > 1) {
              currentStep--;
              showStep(currentStep);
            }
          });

          // ===== Gender card selection =====
          var genderCards = document.querySelectorAll('.onb-gender-card');
          genderCards.forEach(function(card) {
            card.addEventListener('click', function() {
              genderCards.forEach(function(c) { c.classList.remove('active'); });
              this.classList.add('active');
            });
          });

          // ===== Age slider live update =====
          var ageSlider = document.getElementById('age-slider');
          var ageDisplay = document.getElementById('age-display');
          if (ageSlider && ageDisplay) {
            ageSlider.addEventListener('input', function() {
              ageDisplay.textContent = this.value;
            });
          }

          // ===== Goal card selection =====
          var goalCards = document.querySelectorAll('.onb-goal-card');
          goalCards.forEach(function(card) {
            card.addEventListener('click', function() {
              goalCards.forEach(function(c) { c.classList.remove('active'); });
              this.classList.add('active');
            });
          });

          // ===== Activity item selection =====
          var activityItems = document.querySelectorAll('.onb-activity-item');
          activityItems.forEach(function(item) {
            item.addEventListener('click', function() {
              activityItems.forEach(function(i) { i.classList.remove('active'); });
              this.classList.add('active');
            });
          });
        })();
      </script>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
