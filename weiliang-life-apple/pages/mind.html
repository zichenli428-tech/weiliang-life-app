/*
 * Pinguo design tokens — extended for solo-design consumption
 * Brand: Pinguo (Apple Design Library)
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * This file extends the Apple Design Library colors_and_type.css with
 * required semantic radius aliases for apply-html-head-contract.mjs.
 * All original tokens are preserved unchanged.
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, Roboto, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, Roboto, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* Radius semantic aliases for solo-design apply-html-head-contract.mjs */
  --apple-radius-sm: 0.5rem;
  --apple-radius-md: 0.75rem;
  --apple-radius-lg: var(--radius);
  --apple-radius-xl: calc(var(--radius) * 1.25);

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

      /* ===== Mind page layout ===== */
      .mind-page {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--apple-background);
        -webkit-tap-highlight-color: transparent;
      }
      .mind-header { flex-shrink: 0; }
      .mind-boundary { flex-shrink: 0; }
      .mind-messages {
        flex: 1 1 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding-bottom: calc(170px + 2 * env(safe-area-inset-bottom, 0px));
      }
      .mind-input {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(48px + max(env(safe-area-inset-bottom, 0px), 8px));
        z-index: 40;
      }

      /* ===== Header action buttons ===== */
      .act-btn {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--apple-radius-md);
        background: var(--apple-muted);
        color: var(--apple-foreground);
        border: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        flex-shrink: 0;
      }
      .act-btn:active { opacity: 0.55; }
      .act-btn svg { width: 18px; height: 18px; stroke-width: 1.6; }

      /* ===== Emotion quick express rows ===== */
      .emo-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 12px 14px;
        border-radius: var(--apple-radius-md);
        background: var(--apple-card);
        border: 1px solid var(--apple-border);
        box-shadow: var(--shadow-sm);
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
      }
      .emo-row:active { opacity: 0.7; }
      .emo-ico {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .emo-ico svg { width: 18px; height: 18px; stroke-width: 1.7; }
      .emo-row .chev { width: 18px; height: 18px; color: var(--apple-muted-foreground); stroke-width: 1.6; flex-shrink: 0; }

      /* ===== Chat bubbles ===== */
      .bubble {
        max-width: 78%;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.55;
        border-radius: 1rem;
        word-break: break-word;
      }
      .bubble-assistant {
        background: var(--apple-secondary);
        color: var(--apple-secondary-foreground);
        border-top-left-radius: 0.375rem;
      }
      .bubble-user {
        background: var(--apple-chart-1);
        color: var(--apple-primary-foreground);
        border-top-right-radius: 0.375rem;
      }
      .avatar-sm {
        width: 34px;
        height: 34px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .avatar-sm svg { width: 18px; height: 18px; stroke-width: 1.7; }

      /* ===== Input area ===== */
      .mind-textarea {
        flex: 1;
        resize: none;
        background: var(--apple-muted);
        border: 1px solid var(--apple-border);
        border-radius: 1rem;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--apple-foreground);
        min-height: 44px;
        max-height: 120px;
        outline: none;
        font-family: inherit;
      }
      .mind-textarea::placeholder { color: var(--apple-muted-foreground); }
      .send-btn {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        background: var(--chart-5);
        color: var(--apple-primary-foreground);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .send-btn:active { opacity: 0.7; }
      .send-btn svg { width: 18px; height: 18px; stroke-width: 1.8; }

      /* ===== Dock navigation (per spec) ===== */
      .dock-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: var(--apple-sidebar);
        border-top: 1px solid var(--apple-border);
        padding-bottom: max(env(safe-area-inset-bottom), 8px);
        z-index: 50;
        box-shadow: var(--shadow-sm);
      }
      .dock-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 48px;
        min-width: 48px;
        padding: 6px 4px;
        color: var(--apple-muted-foreground);
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
        flex: 1;
      }
      .dock-tab[data-active="true"] { color: var(--apple-chart-5); }
      .dock-icon { width: 22px; height: 22px; stroke-width: 1.5; }
      .dock-label { font-size: 10px; font-weight: 500; line-height: 1.2; }
      @media (max-width: 360px) { .dock-label { font-size: 9px; } }
    </style>
    <main class="mind-page">

      <!-- ===== Section 1: Chat Header ===== -->
      <header class="mind-header" style="background: var(--apple-card); border-bottom: 1px solid var(--apple-border); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 12px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div style="min-width:0;">
            <div style="display:flex; align-items:baseline; gap:6px;">
              <h1 style="font-size:16px; font-weight:600; color: var(--apple-foreground); line-height:1.3; margin:0;">心理疏导</h1>
              <span style="font-size:12px; color: var(--apple-muted-foreground);">· 温暖的朋友</span>
            </div>
            <div style="display:flex; align-items:center; gap:6px; margin-top:5px;">
              <span style="width:6px; height:6px; border-radius:9999px; background: var(--state-success); display:inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--state-success) 20%, transparent);"></span>
              <span style="font-size:12px; color: var(--apple-muted-foreground);">我在这里陪你</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
            <button class="act-btn" aria-label="情绪日记"><i data-lucide="smile"></i></button>
            <button class="act-btn" aria-label="切换角色"><i data-lucide="users"></i></button>
            <button class="act-btn" aria-label="新会话"><i data-lucide="plus"></i></button>
            <button class="act-btn" aria-label="清空会话"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      </header>

      <!-- ===== Section 2: Boundary Declaration Bar ===== -->
      <div class="mind-boundary" style="background: var(--apple-muted); padding: 6px 14px; display:flex; align-items:center; gap:6px;">
        <i data-lucide="info" style="width:12px; height:12px; color: var(--apple-muted-foreground); flex-shrink:0; stroke-width:1.8;"></i>
        <span style="font-size:11px; color: var(--apple-muted-foreground); line-height:1.4;">AI 无法替代专业心理咨询，如有紧急情况请拨打热线</span>
      </div>

      <!-- ===== Section 3: Messages Area ===== -->
      <section class="mind-messages">

        <!-- Welcome Card -->
        <div style="background: var(--apple-card); border: 1px solid var(--apple-border); border-radius: var(--apple-radius-lg); box-shadow: var(--shadow-sm); padding: 28px 20px; margin: 16px; text-align:center;">
          <div style="width:64px; height:64px; border-radius:9999px; background: color-mix(in srgb, var(--chart-5) 20%, transparent); display:inline-flex; align-items:center; justify-content:center; margin: 0 auto 14px;">
            <i data-lucide="heart" style="width:30px; height:30px; color: var(--chart-5); stroke-width:1.7;"></i>
          </div>
          <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px;">
            <h2 style="font-size:17px; font-weight:600; color: var(--apple-foreground); margin:0;">你好，朋友</h2>
            <i data-lucide="leaf" style="width:16px; height:16px; color: var(--chart-5); stroke-width:1.7;"></i>
          </div>
          <p style="font-size:13px; color: var(--apple-muted-foreground); line-height:1.7; margin:0 0 10px;">这里是一个安全的空间，你可以随时和我聊聊心里的感受。无论开心、难过、焦虑还是迷茫，我都会认真倾听。</p>
          <p style="font-size:12px; color: var(--apple-muted-foreground); margin:0;">选择一种感受，或者直接告诉我你的心情</p>
        </div>

        <!-- Emotion Quick Express list -->
        <div style="padding: 0 16px; display:flex; flex-direction:column; gap:8px; margin-bottom:24px;">

          <div class="emo-row" role="button" tabindex="0">
            <span class="emo-ico" style="background: color-mix(in srgb, var(--chart-5) 14%, transparent); color: var(--chart-5);">
              <i data-lucide="circle-alert"></i>
            </span>
            <span style="flex:1; font-size:13px; color: var(--apple-foreground);">最近总是感到焦虑，心里不踏实</span>
            <i data-lucide="chevron-right" class="chev"></i>
          </div>

          <div class="emo-row" role="button" tabindex="0">
            <span class="emo-ico" style="background: color-mix(in srgb, var(--chart-3) 14%, transparent); color: var(--chart-3);">
              <i data-lucide="zap"></i>
            </span>
            <span style="flex:1; font-size:13px; color: var(--apple-foreground);">工作压力好大，感觉快撑不住了</span>
            <i data-lucide="chevron-right" class="chev"></i>
          </div>

          <div class="emo-row" role="button" tabindex="0">
            <span class="emo-ico" style="background: color-mix(in srgb, var(--brand-500) 14%, transparent); color: var(--brand-500);">
              <i data-lucide="frown"></i>
            </span>
            <span style="flex:1; font-size:13px; color: var(--apple-foreground);">今天心情有点低落，提不起劲</span>
            <i data-lucide="chevron-right" class="chev"></i>
          </div>

          <div class="emo-row" role="button" tabindex="0">
            <span class="emo-ico" style="background: color-mix(in srgb, var(--chart-4) 14%, transparent); color: var(--chart-4);">
              <i data-lucide="user-minus"></i>
            </span>
            <span style="flex:1; font-size:13px; color: var(--apple-foreground);">感觉很孤独，好像没人理解我</span>
            <i data-lucide="chevron-right" class="chev"></i>
          </div>

          <div class="emo-row" role="button" tabindex="0">
            <span class="emo-ico" style="background: color-mix(in srgb, var(--state-error) 14%, transparent); color: var(--state-error);">
              <i data-lucide="flame"></i>
            </span>
            <span style="flex:1; font-size:13px; color: var(--apple-foreground);">发生了一些事，让我很生气</span>
            <i data-lucide="chevron-right" class="chev"></i>
          </div>

          <div class="emo-row" role="button" tabindex="0">
            <span class="emo-ico" style="background: color-mix(in srgb, var(--apple-muted-foreground) 14%, transparent); color: var(--apple-muted-foreground);">
              <i data-lucide="battery-low"></i>
            </span>
            <span style="flex:1; font-size:13px; color: var(--apple-foreground);">最近总是很疲惫，精力跟不上</span>
            <i data-lucide="chevron-right" class="chev"></i>
          </div>

        </div>

        <!-- Sample chat exchange -->
        <div style="padding: 0 16px;">
          <div style="text-align:center; margin-bottom:16px;">
            <span style="font-size:11px; color: var(--apple-muted-foreground); background: var(--apple-muted); padding: 3px 12px; border-radius: 9999px;">示例对话</span>
          </div>

          <!-- Assistant message (left) -->
          <div style="display:flex; gap:8px; margin-bottom:16px; align-items:flex-end;">
            <div class="avatar-sm" style="background: color-mix(in srgb, var(--chart-5) 20%, transparent); color: var(--chart-5);">
              <i data-lucide="leaf"></i>
            </div>
            <div style="min-width:0; max-width: calc(78% + 40px);">
              <span style="display:inline-block; font-size:11px; color: var(--chart-5); background: color-mix(in srgb, var(--chart-5) 12%, transparent); padding: 2px 8px; border-radius: 9999px; margin-bottom:5px;">感知到：焦虑</span>
              <div class="bubble bubble-assistant">我理解你的感受，焦虑是很常见的情绪。能告诉我是什么让你感到不安吗？我们可以一起慢慢梳理。</div>
            </div>
          </div>

          <!-- User message (right) -->
          <div style="display:flex; gap:8px; margin-bottom:8px; align-items:flex-end; justify-content:flex-end;">
            <div class="bubble bubble-user">最近工作压力很大，总担心做不好</div>
            <div class="avatar-sm" style="background: var(--chart-1); color:var(--apple-primary-foreground);">我</div>
          </div>
        </div>

      </section>

      <!-- ===== Section 4: Input Area (fixed above dock) ===== -->
      <div class="mind-input" style="background: var(--apple-card); border-top: 1px solid var(--apple-border); padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); display:flex; align-items:flex-end; gap:10px;">
        <textarea class="mind-textarea" rows="1" placeholder="说说你现在的感受…"></textarea>
        <button class="send-btn" aria-label="发送"><i data-lucide="send"></i></button>
      </div>

      <!-- ===== Section 5: Dock Navigation ===== -->
      <nav class="dock-nav h-[56px]" data-mobile-nav="global"><div class="flex justify-around items-center h-full"><a href="#" class="dock-tab" data-dom-id="nav-home" data-nav-key="home"><i data-lucide="house" class="dock-icon"></i><span class="dock-label whitespace-nowrap">看板</span></a><a href="#" class="dock-tab" data-dom-id="nav-advisor" data-nav-key="advisor"><i data-lucide="message-circle" class="dock-icon"></i><span class="dock-label whitespace-nowrap">顾问</span></a><a href="#" class="dock-tab" data-dom-id="nav-mind" data-nav-key="mind" data-active="true"><i data-lucide="smile" class="dock-icon"></i><span class="dock-label whitespace-nowrap">心理</span></a><a href="#" class="dock-tab" data-dom-id="nav-sleep" data-nav-key="sleep"><i data-lucide="moon" class="dock-icon"></i><span class="dock-label whitespace-nowrap">睡眠</span></a><a href="#" class="dock-tab" data-dom-id="nav-record" data-nav-key="record"><i data-lucide="utensils" class="dock-icon"></i><span class="dock-label whitespace-nowrap">记录</span></a><a href="#" class="dock-tab" data-dom-id="nav-profile" data-nav-key="profile"><i data-lucide="user" class="dock-icon"></i><span class="dock-label whitespace-nowrap">我的</span></a></div></nav>

    </main>
